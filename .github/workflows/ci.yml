name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Provide dummy Firebase config for build — emulator is not running in CI
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy-firebase-api-key-for-ci
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: vidcura-dev.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: vidcura-dev
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: vidcura-dev.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:dummy
          FIREBASE_ADMIN_PROJECT_ID: vidcura-dev

  rules-tests:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java (for Firebase emulators)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests with emulator
        run: |
          firebase emulators:exec --only firestore \
            --project learnloom-test \
            "npm run test:rules"
